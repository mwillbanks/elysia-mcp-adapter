name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun link
      - run: bun ci
      - run: bun ci --cwd website
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run fallow
      - run: bun run build
      - run: bun run examples:typecheck
      - run: bun run examples:test
      - run: bun run examples:smoke
      - run: bun run --cwd website lint
      - run: bun run --cwd website typecheck
      - run: bun run --cwd website test
      - run: bun run --cwd website build
      - run: bun run --cwd website verify:build
      - run: bun run --cwd website build
        env:
          VITE_BASE_PATH: /elysia-mcp-adapter/
      - run: bun run --cwd website verify:build
        env:
          VITE_BASE_PATH: /elysia-mcp-adapter/
