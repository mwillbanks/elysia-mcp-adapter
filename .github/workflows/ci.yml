name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run fallow
      - run: bun run build
