name: MCP extension upstream watch

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Compare upstream and verify pinned sources
        id: drift
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun --bun run extensions:check-drift

      - name: Open or update the review item
        if: steps.drift.outputs.drift == 'true'
        uses: actions/github-script@v9.0.0
        env:
          DRIFT_REPORT: ${{ steps.drift.outputs.report }}
        with:
          script: |
            const title = "Review MCP extension upstream drift";
            const body = process.env.DRIFT_REPORT;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });
            const issue = issues.find((candidate) => candidate.title === title);
            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Fail when upstream drift requires review
        if: steps.drift.outcome == 'failure' || steps.drift.outputs.drift == 'true'
        run: exit 1
