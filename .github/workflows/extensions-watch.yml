name: MCP extension upstream watch

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Compare upstream and verify pinned sources
        id: drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run extensions:check-drift

      - name: Open or update the review item
        if: steps.drift.outputs.drift == 'true'
        uses: actions/github-script@v8
        env:
          DRIFT_REPORT: ${{ steps.drift.outputs.report }}
        with:
          script: |
            const title = "Review MCP extension upstream drift";
            const body = process.env.DRIFT_REPORT;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });
            const issue = issues.find((candidate) => candidate.title === title);
            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
