  <g fill="#09090b" stroke="url(#frame)" stroke-width="4"><circle cx="35" cy="55" r="7"/><circle cx="35" cy="105" r="7"/><circle cx="125" cy="55" r="7"/><circle cx="125" cy="105" r="7"/></g>
  <path d="M92 54H72c-8 0-14 6-14 14v24c0 8 6 14 14 14h20" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
