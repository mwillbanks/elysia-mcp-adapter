<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title description">
  <title id="title">Elysia MCP Adapter</title>
  <desc id="description">A luminous gateway connecting Elysia routes to Model Context Protocol nodes.</desc>
  <defs>
    <linearGradient id="frame" x1="18" y1="18" x2="142" y2="142" gradientUnits="userSpaceOnUse"><stop stop-color="#fb7185"/><stop offset=".48" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="signal" x1="42" y1="48" x2="122" y2="112" gradientUnits="userSpaceOnUse"><stop stop-color="#fda4af"/><stop offset=".52" stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(80 80) rotate(90) scale(70)" gradientUnits="userSpaceOnUse"><stop stop-color="#312e81" stop-opacity=".72"/><stop offset="1" stop-color="#09090b" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
